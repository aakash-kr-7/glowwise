name: glowwise
x-common: &common
  restart: unless-stopped
  logging:
    driver: local
    options:
      max-size: "5m"
      max-file: "3"
services:
  database:
    <<: *common
    image: mariadb:11.4.13@sha256:1292844148b311e4ed4300022a996d39083f415a963e970cf47cad1b3b18e3a6
    mem_limit: 256m
    environment:
      MARIADB_DATABASE: glowwise
      MARIADB_USER: glowwise
      MARIADB_PASSWORD_FILE: /run/secrets/db-password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db-root-password
    secrets: [db-password, db-root-password]
    command: ["--innodb-buffer-pool-size=64M", "--max-connections=20", "--performance-schema=OFF", "--aria-pagecache-buffer-size=16M", "--key-buffer-size=8M"]
    volumes: [database:/var/lib/mysql]
    networks: [database]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 20s
      timeout: 5s
      retries: 10
  wordpress:
    <<: *common
    image: wordpress:7.1.3-php8.3-apache@sha256:8ecd8d8e374167ea22235acf30f80d1165b82f07ffa5bcef90c1cad8f7be251f
    mem_limit: 384m
    environment: &wp-env
      WORDPRESS_DB_HOST: database:3306
      WORDPRESS_DB_NAME: glowwise
      WORDPRESS_DB_USER: glowwise
      WORDPRESS_DB_PASSWORD_FILE: /run/secrets/db-password
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', '${GW_ORIGIN:-https://glowwise.tech}');
        define('WP_SITEURL', '${GW_ORIGIN:-https://glowwise.tech}');
        define('WP_ENVIRONMENT_TYPE', 'development');
        define('DISALLOW_FILE_EDIT', true);
        define('AUTOMATIC_UPDATER_DISABLED', true);
        define('DISABLE_WP_CRON', true);
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') { $$_SERVER['HTTPS'] = 'on'; }
    secrets: [db-password]
    depends_on:
      database: {condition: service_healthy}
    volumes: &wp-volumes
      - wordpress:/var/www/html
      - ../../theme/glowwise:/var/www/html/wp-content/themes/glowwise
      - ../../plugins/glowwise-core:/var/www/html/wp-content/plugins/glowwise-core
      - ./php.ini:/usr/local/etc/php/conf.d/glowwise.ini:ro
      - ./apache-limits.conf:/etc/apache2/conf-enabled/glowwise-limits.conf:ro
      - ../../content:/srv/glowwise/content:ro
      - ../../tests:/srv/glowwise/tests:ro
      - ../scripts:/srv/glowwise/scripts:ro
      - ${GW_PRIVATE_ROOT:-/srv/glowwise}/private/updraft:/srv/glowwise/updraft-private
    networks: [web, database]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/wp-includes/css/dashicons.min.css"]
      interval: 30s
      timeout: 5s
      retries: 5
  caddy:
    <<: *common
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    mem_limit: 128m
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    secrets: [development-auth]
    networks: [web]
    depends_on:
      wordpress: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -T 2 -S -O /dev/null --header='Host: glowwise.tech' http://127.0.0.1/ 2>&1 | grep -q '301 Moved Permanently'"]
      interval: 30s
      timeout: 5s
      retries: 5
  wpcli:
    image: wordpress:cli-php8.3@sha256:36243da432a0f0a3b56dc3240ecee9b159108d71305e7c064d987a20a465bfde
    profiles: [tools]
    user: "33:33"
    mem_limit: 192m
    environment: *wp-env
    secrets: [db-password]
    volumes: *wp-volumes
    networks: [web, database]
    entrypoint: ["wp"]
volumes:
  database:
  wordpress:
  caddy-data:
  caddy-config:
networks:
  web:
  database:
    internal: true
secrets:
  db-password: {file: "${GW_PRIVATE_ROOT:-/srv/glowwise}/secrets/db-password"}
  db-root-password: {file: "${GW_PRIVATE_ROOT:-/srv/glowwise}/secrets/db-root-password"}
  development-auth: {file: "${GW_PRIVATE_ROOT:-/srv/glowwise}/secrets/development-auth.caddy"}
